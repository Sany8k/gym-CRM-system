services:
  postgres:
    image: postgres:17
    container_name: gym_crm_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gym_crm
    ports:
      - "5432:5432"
    volumes:
      - gym_crm_postgres_data:/var/lib/postgresql/data

volumes:
  gym_crm_postgres_data:
